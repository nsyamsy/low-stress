name: low-stress

# Profil:
#   lan    -> web, server, db. HTTP di http://<host>:8080 (tanpa Caddy).
#   public -> sama seperti lan, ditambah Caddy untuk HTTPS.
#
# Salin `.env.example` menjadi `.env` sebelum menjalankan compose.

services:
  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-low_stress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-low_stress}
      POSTGRES_DB: low_stress_test
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  db:
    image: postgres:16-alpine
    profiles: ["lan", "public"]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-low_stress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-low_stress}
      POSTGRES_DB: ${POSTGRES_DB:-low_stress}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    profiles: ["lan", "public"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DEPLOY_MODE: ${DEPLOY_MODE:-lan}
      HOST: 0.0.0.0
      PORT: 3001
      # Selalu memakai nama layanan Compose, bukan host dari `.env` lokal.
      DATABASE_URL: postgres://${POSTGRES_USER:-low_stress}:${POSTGRES_PASSWORD:-low_stress}@db:5432/${POSTGRES_DB:-low_stress}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    profiles: ["lan", "public"]
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
