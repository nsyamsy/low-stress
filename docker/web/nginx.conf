# Sajikan SPA dan teruskan API/WebSocket ke container server.
# Caddy pada profil `public` berada di depan nginx ini.

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Pemeriksaan kesehatan diteruskan ke server agar `docker compose`
  # dapat memakai satu alamat web.
  location = /healthz {
    proxy_pass http://server:3001/healthz;
  }

  location = /readyz {
    proxy_pass http://server:3001/readyz;
  }

  location /api/ {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Socket.IO memakai koneksi upgrade.
  location /ws {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 1h;
  }

  # Service worker dan manifest tidak boleh di-cache lama.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Aset ber-hash aman di-cache permanen.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback. Permintaan API dan WebSocket tidak pernah sampai ke sini.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
