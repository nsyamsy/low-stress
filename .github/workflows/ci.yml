name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Database sementara khusus CI untuk tes integrasi (auth, dll).
    # Tidak menyentuh database asli mana pun.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: low_stress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d low_stress_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DEPLOY_MODE: lan
      APP_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://ci:ci@localhost:5432/low_stress_test
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/low_stress_test
      # Nilai khusus CI, bukan rahasia.
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate database
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: i18n keys
        run: pnpm i18n:check

      - name: Migration table prefixes & secret scan
        run: pnpm check:migrations

      - name: Asset ledger & licenses
        run: pnpm check:assets

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm test:e2e
