<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Gaduh di Stasiun Hening">
  <title>Gaduh di Stasiun Hening</title>
  <defs>
    <linearGradient id="cosmic-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#1C2541" />
      <stop offset="100%" stop-color="#3A506B" />
    </linearGradient>
    <linearGradient id="station-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BC0BE" />
      <stop offset="100%" stop-color="#3A506B" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6FFFE9" />
      <stop offset="100%" stop-color="#5BC0BE" />
    </linearGradient>
    <radialGradient id="planet" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#5BC0BE" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Latar Antariksa -->
  <rect width="400" height="180" fill="url(#cosmic-bg)" />
  
  <!-- Bintang-bintang -->
  <circle cx="35" cy="25" r="1.5" fill="#FFFFFF" opacity="0.8" />
  <circle cx="85" cy="65" r="1" fill="#FFFFFF" opacity="0.6" />
  <circle cx="140" cy="30" r="1.2" fill="#FFFFFF" opacity="0.7" />
  <circle cx="280" cy="20" r="1.5" fill="#FFFFFF" opacity="0.8" />
  <circle cx="360" cy="45" r="1" fill="#FFFFFF" opacity="0.6" />
  <circle cx="330" cy="110" r="1.2" fill="#FFFFFF" opacity="0.7" />
  <circle cx="50" cy="140" r="1" fill="#FFFFFF" opacity="0.5" />
  <circle cx="160" cy="155" r="1.5" fill="#FFFFFF" opacity="0.8" />
  
  <!-- Nebula & Planet Latar Belakang -->
  <circle cx="320" cy="70" r="55" fill="url(#planet)" />

  <!-- Siluet Stasiun Orbital Hening -->
  <g transform="translate(180, 50)">
    <!-- Panel Surya Kiri -->
    <rect x="-110" y="25" width="45" height="24" rx="2" fill="#48CAE4" opacity="0.7" stroke="#0077B6" stroke-width="1.5" />
    <line x1="-87" y1="25" x2="-87" y2="49" stroke="#0077B6" stroke-width="1" />
    <line x1="-110" y1="37" x2="-65" y2="37" stroke="#0077B6" stroke-width="1" />
    <line x1="-65" y1="37" x2="-45" y2="37" stroke="#90E0EF" stroke-width="2.5" />

    <!-- Modul Utama Stasiun -->
    <rect x="-45" y="20" width="90" height="34" rx="10" fill="url(#station-hull)" stroke="#6FFFE9" stroke-width="1.5" />
    
    <!-- Kubah Observasi -->
    <circle cx="0" cy="18" r="12" fill="#6FFFE9" opacity="0.85" />
    
    <!-- Antena Komunikasi Piringan -->
    <path d="M 35 12 Q 45 6 52 16" stroke="#6FFFE9" stroke-width="2" fill="none" />
    <line x1="43" y1="11" x2="38" y2="20" stroke="#6FFFE9" stroke-width="1.5" />

    <!-- Panel Surya Kanan -->
    <line x1="45" y1="37" x2="65" y2="37" stroke="#90E0EF" stroke-width="2.5" />
    <rect x="65" y="25" width="45" height="24" rx="2" fill="#48CAE4" opacity="0.7" stroke="#0077B6" stroke-width="1.5" />
    <line x1="87" y1="25" x2="87" y2="49" stroke="#0077B6" stroke-width="1" />
    <line x1="65" y1="37" x2="110" y2="37" stroke="#0077B6" stroke-width="1" />
  </g>

  <!-- Karakter Mochi Kosmonot Mengambang -->
  <g transform="translate(90, 95)">
    <!-- Bayangan / Pancaran Kosmik -->
    <ellipse cx="0" cy="12" rx="28" ry="24" fill="#6FFFE9" opacity="0.2" />

    <!-- Badan Mochi Bulat -->
    <ellipse cx="0" cy="10" rx="24" ry="20" fill="#F4F1DE" stroke="#3D405B" stroke-width="2" />

    <!-- Helm Kaca Bening -->
    <circle cx="0" cy="5" r="21" fill="#A8DADC" fill-opacity="0.35" stroke="#457B9D" stroke-width="2" />
    <ellipse cx="-7" cy="-2" rx="6" ry="3" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 -7 -2)" />

    <!-- Wajah Mochi Imut (Mata & Pipi) -->
    <circle cx="-6" cy="7" r="2.5" fill="#1D3557" />
    <circle cx="6" cy="7" r="2.5" fill="#1D3557" />
    <ellipse cx="-11" cy="12" rx="3" ry="1.5" fill="#E63946" opacity="0.5" />
    <ellipse cx="11" cy="12" rx="3" ry="1.5" fill="#E63946" opacity="0.5" />
    <path d="M -2 11 Q 0 13 2 11" stroke="#1D3557" stroke-width="1.2" fill="none" />

    <!-- Antena Helm Berkedip -->
    <line x1="0" y1="-16" x2="0" y2="-24" stroke="#457B9D" stroke-width="2" />
    <circle cx="0" cy="-26" r="3.5" fill="#E63946" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Tipografi Judul Game -->
  <text x="210" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="1.5" fill="#F4F1DE">GADUH DI</text>
  <text x="210" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="1.5" fill="#6FFFE9">STASIUN HENING</text>
</svg>
