<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ludo">
  <title>Ludo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a" />
      <stop offset="0.55" stop-color="#4338ca" />
      <stop offset="1" stop-color="#0f766e" />
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#ffffff" opacity="0.14" />
    </pattern>
  </defs>
  <rect width="400" height="180" fill="url(#bg)" />
  <rect width="400" height="180" fill="url(#dots)" />

  <!-- Papan -->
  <rect x="124" y="14" width="152" height="152" rx="10" fill="#f8f6f0" />
  <!-- Kandang -->
  <rect x="130" y="20" width="52" height="52" rx="7" fill="#E8383D" />
  <rect x="218" y="20" width="52" height="52" rx="7" fill="#3FA535" />
  <rect x="218" y="108" width="52" height="52" rx="7" fill="#2D7FE0" />
  <rect x="130" y="108" width="52" height="52" rx="7" fill="#F9C910" />
  <g fill="#ffffff" opacity="0.92">
    <circle cx="144" cy="34" r="6" /><circle cx="168" cy="34" r="6" /><circle cx="144" cy="58" r="6" /><circle cx="168" cy="58" r="6" />
    <circle cx="232" cy="34" r="6" /><circle cx="256" cy="34" r="6" /><circle cx="232" cy="58" r="6" /><circle cx="256" cy="58" r="6" />
    <circle cx="232" cy="122" r="6" /><circle cx="256" cy="122" r="6" /><circle cx="232" cy="146" r="6" /><circle cx="256" cy="146" r="6" />
    <circle cx="144" cy="122" r="6" /><circle cx="168" cy="122" r="6" /><circle cx="144" cy="146" r="6" /><circle cx="168" cy="146" r="6" />
  </g>
  <!-- Jalur silang -->
  <g stroke="#cfc8b5" stroke-width="1.2" fill="#ffffff">
    <rect x="182" y="14" width="36" height="152" />
    <rect x="124" y="72" width="152" height="36" />
  </g>
  <g stroke="#cfc8b5" stroke-width="1.2">
    <path d="M182 38 H218 M182 62 H218 M182 118 H218 M182 142 H218" />
    <path d="M148 72 V108 M172 72 V108 M228 72 V108 M252 72 V108" />
  </g>
  <!-- Lajur rumah berwarna -->
  <rect x="124" y="84" width="58" height="12" fill="#E8383D" />
  <rect x="194" y="14" width="12" height="58" fill="#3FA535" />
  <rect x="218" y="84" width="58" height="12" fill="#2D7FE0" />
  <rect x="194" y="108" width="12" height="58" fill="#F9C910" />
  <!-- Pusat -->
  <polygon points="182,72 218,72 200,90" fill="#3FA535" />
  <polygon points="218,72 218,108 200,90" fill="#2D7FE0" />
  <polygon points="182,108 218,108 200,90" fill="#F9C910" />
  <polygon points="182,72 182,108 200,90" fill="#E8383D" />

  <!-- Pion -->
  <g stroke="#ffffff" stroke-width="2">
    <circle cx="200" cy="52" r="7" fill="#3FA535" />
    <circle cx="152" cy="90" r="7" fill="#E8383D" />
    <circle cx="248" cy="90" r="7" fill="#2D7FE0" />
  </g>

  <!-- Dadu -->
  <g transform="rotate(-14 62 90)">
    <rect x="38" y="66" width="48" height="48" rx="10" fill="#ffffff" />
    <g fill="#1e3a8a"><circle cx="50" cy="78" r="4.5" /><circle cx="74" cy="78" r="4.5" /><circle cx="62" cy="90" r="4.5" /><circle cx="50" cy="102" r="4.5" /><circle cx="74" cy="102" r="4.5" /></g>
  </g>
  <g transform="rotate(12 338 96)">
    <rect x="314" y="72" width="48" height="48" rx="10" fill="#ffffff" />
    <g fill="#1e3a8a"><circle cx="326" cy="84" r="4.5" /><circle cx="338" cy="96" r="4.5" /><circle cx="350" cy="108" r="4.5" /></g>
  </g>
</svg>
